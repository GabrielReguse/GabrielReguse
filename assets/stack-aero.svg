<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Technology start screen</title><desc id="desc">A Windows 8 style start screen showing the technologies Gabriel uses most.</desc>
<defs>

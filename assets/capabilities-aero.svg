<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">What I do</title><desc id="desc">Four colorful Windows 8 inspired tiles for product design, interface systems, front-end engineering and product thinking.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#064d75"/><stop offset=".55" stop-color="#0878a5"/><stop offset="1" stop-color="#13b6c7"/></linearGradient>
  <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0078d7"/></linearGradient>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9be35d"/><stop offset="1" stop-color="#37a447"/></linearGradient>
  <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ef73c5"/><stop offset="1" stop-color="#b82791"/></linearGradient>
  <linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd45a"/><stop offset="1" stop-color="#f28c18"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#01273d" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="360" rx="30" fill="url(#bg)"/>
<circle cx="1110" cy="75" r="56" fill="#fff" opacity=".18" stroke="#fff" stroke-opacity=".5"/><circle cx="1078" cy="51" r="15" fill="#fff" opacity=".42"/>
<text x="54" y="54" fill="#e8fbff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">WHAT I ACTUALLY DO</text>
<g filter="url(#s)">
  <rect x="52" y="84" width="264" height="220" rx="12" fill="url(#p)"/><rect x="330" y="84" width="264" height="220" rx="12" fill="url(#b)"/><rect x="608" y="84" width="264" height="220" rx="12" fill="url(#g)"/><rect x="886" y="84" width="262" height="220" rx="12" fill="url(#o)"/>
</g>
<g fill="url(#shine)"><rect x="52" y="84" width="264" height="88" rx="12"/><rect x="330" y="84" width="264" height="88" rx="12"/><rect x="608" y="84" width="264" height="88" rx="12"/><rect x="886" y="84" width="262" height="88" rx="12"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#fff">
  <circle cx="92" cy="128" r="19" fill="none" stroke="#fff" stroke-width="4"/><path d="M81 128h22M92 117v22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="78" y="195" font-size="27" font-weight="700">Product Design</text><text x="78" y="226" font-size="15">Flows, hierarchy, prototypes</text><text x="78" y="249" font-size="15">and decisions before code.</text>
  <rect x="356" y="108" width="38" height="38" rx="7" fill="none" stroke="#fff" stroke-width="4"/><rect x="374" y="126" width="38" height="38" rx="7" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="356" y="195" font-size="27" font-weight="700">UI Systems</text><text x="356" y="226" font-size="15">Responsive interfaces, states,</text><text x="356" y="249" font-size="15">components and visual language.</text>
  <path d="M642 111l30 17-30 17-30-17zM612 153l30 17 30-17" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <text x="634" y="195" font-size="27" font-weight="700">Front-end</text><text x="634" y="226" font-size="15">React, TypeScript, motion</text><text x="634" y="249" font-size="15">and production-ready UI.</text>
  <circle cx="924" cy="128" r="26" fill="none" stroke="#fff" stroke-width="4"/><path d="M912 129l9 9 17-22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="912" y="195" font-size="27" font-weight="700">Product Thinking</text><text x="912" y="226" font-size="15">Solve the actual problem,</text><text x="912" y="249" font-size="15">then make the solution feel good.</text>
</g>
</svg>
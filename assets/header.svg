  <text x="70" y="82" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.3">DESIGN ENGINEERING / FRONT-END / PRODUCT</text>
  <text x="70" y="190" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-3.2">GABRIEL REGUSE</text>
  <text x="72" y="236" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">I design interfaces, build systems, and obsess over the details between them.</text>

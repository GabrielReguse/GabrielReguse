<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Certifólio</title><desc id="d">A colorful product card showing courses, certificates and a public profile flow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#32b8ee"/><stop offset=".58" stop-color="#65d4f3"/><stop offset="1" stop-color="#d8fbff"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9be45c"/><stop offset="1" stop-color="#39ad49"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38c8ff"/><stop offset="1" stop-color="#0078d7"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd55a"/><stop offset="1" stop-color="#f28c18"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#05789a" flood-opacity=".28"/></filter>

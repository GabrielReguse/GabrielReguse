<rect width="1200" height="340" rx="28" fill="url(#bg)"/>
<path d="M0 278C173 232 323 250 451 281C605 319 793 284 936 260C1046 242 1121 248 1200 260V340H0Z" fill="#72d655" opacity=".9"/>
<circle cx="1130" cy="62" r="42" fill="#fff" opacity=".22" stroke="#fff" stroke-opacity=".55"/><circle cx="1109" cy="45" r="11" fill="#fff" opacity=".52"/>
<g font-family="Segoe UI,Arial,sans-serif">
  <text x="54" y="66" fill="#073b59" font-size="14" font-weight="800" letter-spacing="3">01 / PRODUCT</text>
  <text x="52" y="135" fill="#073b59" font-size="52" font-weight="700">Certifólio</text>
  <text x="54" y="176" fill="#0b5674" font-size="20" font-weight="600">Make every course worth showing.</text>
  <text x="54" y="216" fill="#0b5674" font-size="15">Courses, certificates, learning goals and a public profile</text>
  <text x="54" y="239" fill="#0b5674" font-size="15">built around privacy, organization and presentation.</text>
  <text x="54" y="302" fill="#073b59" font-size="13" font-weight="700">REACT 19 · TYPESCRIPT · HONO · CLOUDFLARE · D1 · DRIZZLE · BETTER AUTH</text>
</g>
<g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif" fill="#fff">
  <rect x="625" y="63" width="150" height="104" rx="10" fill="url(#blue)"/><rect x="786" y="63" width="150" height="104" rx="10" fill="url(#green)"/><rect x="947" y="63" width="202" height="104" rx="10" fill="url(#orange)"/>
  <g opacity=".55" fill="url(#glass)"><rect x="625" y="63" width="150" height="42" rx="10"/><rect x="786" y="63" width="150" height="42" rx="10"/><rect x="947" y="63" width="202" height="42" rx="10"/></g>
  <text x="647" y="108" font-size="14" font-weight="700" letter-spacing="1.5">COURSES</text><text x="647" y="144" font-size="25" font-weight="700">24</text>
  <text x="808" y="108" font-size="14" font-weight="700" letter-spacing="1.5">HOURS</text><text x="808" y="144" font-size="25" font-weight="700">186h</text>
  <text x="969" y="108" font-size="14" font-weight="700" letter-spacing="1.5">PUBLIC PROFILE</text><text x="969" y="143" font-size="18" font-weight="700">share what matters</text>
  <rect x="625" y="181" width="524" height="91" rx="13" fill="#fff" fill-opacity=".78" stroke="#fff"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#0b5674">
  <circle cx="663" cy="226" r="18" fill="#38bdf8"/><text x="655" y="232" fill="#fff" font-size="17" font-weight="800">✓</text>
  <text x="696" y="214" font-size="15" font-weight="700">React &amp; TypeScript</text><text x="696" y="238" font-size="13">Completed course · certificate protected</text>
  <rect x="944" y="211" width="171" height="30" rx="15" fill="#66c74d"/><text x="977" y="231" fill="#fff" font-size="12" font-weight="700">VISIBLE ON PROFILE</text>

<g font-family="Segoe UI,Arial,sans-serif" fill="#07566b"><text x="52" y="78" font-size="14" font-weight="800" letter-spacing="3">03 / LEARNING PRODUCT</text><text x="50" y="143" font-size="52" font-weight="700">Folium</text><text x="52" y="184" font-size="20" font-weight="600">Study tools that do not feel like school software.</text><text x="52" y="224" font-size="15">Mind maps, presentations and visual study material with</text><text x="52" y="247" font-size="15">editing, templates, motion and user-controlled generation.</text><text x="52" y="308" font-size="13" font-weight="700">REACT 19 · TYPESCRIPT · VITE · FRAMER MOTION · FASTAPI · POSTGRESQL</text></g>

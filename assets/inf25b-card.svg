<circle cx="1135" cy="58" r="45" fill="#fff" opacity=".16" stroke="#fff" stroke-opacity=".42"/><circle cx="1114" cy="42" r="11" fill="#fff" opacity=".45"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#fff"><text x="52" y="78" font-size="14" font-weight="800" letter-spacing="3" opacity=".88">02 / COMMUNITY PRODUCT</text><text x="50" y="143" font-size="52" font-weight="700">INF 25B</text><text x="52" y="184" font-size="20" font-weight="600">A digital layer for the real routine of my class.</text><text x="52" y="224" font-size="15" opacity=".95">Tasks, exams, events, announcements, conversations,</text><text x="52" y="247" font-size="15" opacity=".95">notifications and administration in one responsive PWA.</text><text x="52" y="308" font-size="13" font-weight="700">JAVASCRIPT · HTML · CSS · REST API · PWA · VERCEL</text></g>
<g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif" fill="#fff"><g><rect x="625" y="71" width="235" height="116" rx="8" fill="#00a4ef"/><rect x="625" y="71" width="235" height="45" rx="8" fill="url(#shine)"/><text x="648" y="113" font-size="13" font-weight="700" letter-spacing="1.4">TODAY</text><text x="648" y="151" font-size="26" font-weight="700">3 tasks</text><text x="648" y="173" font-size="12">2 due · 1 upcoming</text></g><g><rect x="872" y="71" width="128" height="116" rx="8" fill="#7fba00"/><rect x="872" y="71" width="128" height="45" rx="8" fill="url(#shine)"/><text x="894" y="113" font-size="12" font-weight="700">CALENDAR</text><text x="894" y="154" font-size="32" font-weight="700">26</text></g><g><rect x="1012" y="71" width="136" height="116" rx="8" fill="#d83b90"/><rect x="1012" y="71" width="136" height="45" rx="8" fill="url(#shine)"/><text x="1034" y="113" font-size="12" font-weight="700">CHAT</text><text x="1034" y="154" font-size="28" font-weight="700">12</text><text x="1034" y="173" font-size="11">new messages</text></g><g><rect x="625" y="199" width="523" height="82" rx="9" fill="#fff" fill-opacity=".86" stroke="#fff"/><circle cx="661" cy="240" r="17" fill="#f28c18"/><rect x="692" y="221" width="210" height="11" rx="5" fill="#41506e" opacity=".88"/><rect x="692" y="241" width="358" height="9" rx="4" fill="#6b7c9f" opacity=".48"/><rect x="692" y="258" width="288" height="9" rx="4" fill="#6b7c9f" opacity=".38"/></g></g>
<text x="632" y="303" fill="#eafaff" font-family="Segoe UI,Arial,sans-serif" font-size="12">PWA shell · opt-in notifications · class communication · admin tools</text>

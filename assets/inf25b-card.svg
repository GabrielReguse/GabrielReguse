<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">INF 25B</title><desc id="d">A Windows 7 Aero styled class platform window with tasks, calendar, chat and administration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2257b8"/><stop offset=".55" stop-color="#5a76d6"/><stop offset="1" stop-color="#7bd9f5"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".54"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="aeroBar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f6ff"/><stop offset=".34" stop-color="#90d6f6"/><stop offset=".66" stop-color="#4aa5d8"/><stop offset="1" stop-color="#247fba"/></linearGradient>
  <linearGradient id="captionBtn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3fcff"/><stop offset=".5" stop-color="#8bc9e8"/><stop offset="1" stop-color="#438db7"/></linearGradient>

<g font-family="Segoe UI,Arial,sans-serif" fill="#0b5674"><circle cx="663" cy="234" r="18" fill="#38bdf8"/><text x="655" y="240" fill="#fff" font-size="17" font-weight="800">✓</text><text x="696" y="222" font-size="15" font-weight="700">React &amp; TypeScript</text><text x="696" y="246" font-size="13">Completed course · certificate protected</text><rect x="944" y="219" width="171" height="30" rx="15" fill="#66c74d"/><text x="977" y="239" fill="#fff" font-size="12" font-weight="700">VISIBLE ON PROFILE</text></g>

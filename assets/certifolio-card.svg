<g font-family="Segoe UI,Arial,sans-serif"><text x="54" y="78" fill="#073b59" font-size="14" font-weight="800" letter-spacing="3">01 / PRODUCT</text><text x="52" y="143" fill="#073b59" font-size="52" font-weight="700">Certifólio</text><text x="54" y="184" fill="#0b5674" font-size="20" font-weight="600">Make every course worth showing.</text><text x="54" y="224" fill="#0b5674" font-size="15">Courses, certificates, learning goals and a public profile</text><text x="54" y="247" fill="#0b5674" font-size="15">built around privacy, organization and presentation.</text><text x="54" y="308" fill="#073b59" font-size="13" font-weight="700">REACT 19 · TYPESCRIPT · HONO · CLOUDFLARE · D1 · DRIZZLE · BETTER AUTH</text></g>

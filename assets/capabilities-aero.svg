  <linearGradient id="toolbar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e1edf4"/></linearGradient>
  <linearGradient id="captionBtn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5fcff"/><stop offset=".5" stop-color="#91cce8"/><stop offset="1" stop-color="#448eb7"/></linearGradient>

  <g transform="translate(878 179)"><rect width="270" height="144" rx="6" fill="#fff" stroke="#c4d7e2"/><circle cx="55" cy="55" r="34" fill="url(#orange)"/><path d="M42 56l9 9 19-23" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="38" font-size="18" font-weight="600" fill="#245d87">Product Thinking</text><text x="103" y="64" font-size="13" fill="#405766">Solve the real problem</text><text x="103" y="84" font-size="13" fill="#405766">Reduce friction</text><text x="103" y="104" font-size="13" fill="#405766">Iterate with purpose</text><text x="23" y="132" font-size="12" fill="#7a8c97">Make the result feel obvious</text></g>
</g>

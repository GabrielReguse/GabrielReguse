<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Capabilities Control Panel</title><desc id="desc">A Windows 7 Aero Control Panel style window presenting product design, UI systems, front-end engineering and product thinking.</desc>
<defs>

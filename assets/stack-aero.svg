<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Technology Explorer</title><desc id="desc">A Windows 7 Aero Explorer-style window showing Gabriel's main technologies and tools.</desc>
<defs>
  <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c9bd8"/><stop offset=".52" stop-color="#69cdf2"/><stop offset="1" stop-color="#c8f7ff"/></linearGradient>
  <linearGradient id="aeroBar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7faff" stop-opacity=".95"/><stop offset=".28" stop-color="#9bdcf6" stop-opacity=".88"/><stop offset=".62" stop-color="#4ba6d7" stop-opacity=".94"/><stop offset="1" stop-color="#197db7" stop-opacity=".96"/></linearGradient>
  <linearGradient id="toolbar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#eef6fb"/><stop offset="1" stop-color="#dce9f1"/></linearGradient>
  <linearGradient id="captionBtn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5fcff"/><stop offset=".5" stop-color="#91cce8"/><stop offset="1" stop-color="#448eb7"/></linearGradient>
  <linearGradient id="closeBtn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd3cb"/><stop offset=".42" stop-color="#ee725c"/><stop offset="1" stop-color="#b82d19"/></linearGradient>
  <linearGradient id="iconBlue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#66d8ff"/><stop offset="1" stop-color="#087fc3"/></linearGradient>
  <linearGradient id="iconGreen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b3ec6b"/><stop offset="1" stop-color="#42a94d"/></linearGradient>
  <linearGradient id="iconOrange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd96d"/><stop offset="1" stop-color="#e98714"/></linearGradient>
  <linearGradient id="iconPurple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d59cf1"/><stop offset="1" stop-color="#8651bd"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#18506d" flood-opacity=".32"/></filter>
</defs>
<rect width="1200" height="520" rx="14" fill="url(#desktop)"/>
<circle cx="1080" cy="450" r="120" fill="#79d85c" opacity=".75"/><circle cx="1140" cy="56" r="54" fill="#fff" opacity=".18" stroke="#fff" stroke-opacity=".55"/>
<g filter="url(#shadow)">
  <rect x="20" y="18" width="1160" height="484" rx="12" fill="#f7fbfe" fill-opacity=".96"/>
</g>
<!-- Aero frame -->
<rect x="17" y="15" width="1166" height="490" rx="13" fill="none" stroke="#0b6fa8" stroke-width="6"/>
<rect x="21" y="19" width="1158" height="482" rx="10" fill="none" stroke="#d0f4ff" stroke-width="1.5"/>
<path d="M27 19H1173Q1179 19 1179 25V56H21V25Q21 19 27 19Z" fill="url(#aeroBar)"/>
<path d="M27 21H1173" stroke="#fff" stroke-width="2" opacity=".72"/>
<text x="39" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#0a4261">Technology Explorer</text>
<!-- Caption buttons -->
<g transform="translate(1017 20)"><g><rect width="47" height="28" rx="2" fill="url(#captionBtn)" stroke="#2c7097"/><path d="M17 19h13" stroke="#fff" stroke-width="2"/><path d="M17 18h13" stroke="#2b5c78"/></g><g transform="translate(48)"><rect width="47" height="28" rx="2" fill="url(#captionBtn)" stroke="#2c7097"/><rect x="17" y="8" width="13" height="11" fill="none" stroke="#fff" stroke-width="2"/><rect x="18" y="9" width="11" height="9" fill="none" stroke="#2b5c78"/></g><g transform="translate(96)"><rect width="59" height="28" rx="2" fill="url(#closeBtn)" stroke="#9e2618"/><path d="M22 8l15 12M37 8L22 20" stroke="#fff" stroke-width="2.2"/></g></g>
<!-- Explorer navigation / address bar -->
<rect x="21" y="56" width="1158" height="58" fill="url(#toolbar)" stroke="#a8c2d2" stroke-width="1"/>
<g transform="translate(38 69)"><circle cx="13" cy="13" r="13" fill="#eaf5fb" stroke="#7fa8bf"/><path d="M17 7l-7 6 7 6" fill="none" stroke="#2a729c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="13" r="13" fill="#eaf5fb" stroke="#7fa8bf"/><path d="M43 7l7 6-7 6" fill="none" stroke="#2a729c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="13" r="13" fill="#f4f8fb" stroke="#a3b5bf"/><path d="M75 12h10M80 7v10" stroke="#5b8096" stroke-width="1.6"/></g>
<rect x="140" y="67" width="663" height="34" rx="3" fill="#fff" stroke="#7fa7bc"/>
<text x="158" y="89" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#405767">GabrielReguse  ›  Skills  ›  Technologies</text>
<rect x="826" y="67" width="328" height="34" rx="3" fill="#fff" stroke="#7fa7bc"/>
<text x="844" y="89" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8497a4">Search technologies</text>
<circle cx="1128" cy="84" r="7" fill="none" stroke="#2d78a5" stroke-width="2"/><path d="M1133 89l6 6" stroke="#2d78a5" stroke-width="2"/>
<!-- content header -->
<text x="48" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#24475c">Technologies I use most</text>
<text x="49" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#657b89">Front-end, interface design, backend services and deployment.</text>
<!-- categories -->
<g font-family="Segoe UI,Arial,sans-serif">
  <g transform="translate(50 202)">
    <rect width="520" height="117" rx="6" fill="#fff" stroke="#c5d8e3"/>
    <rect x="17" y="17" width="74" height="74" rx="14" fill="url(#iconBlue)" stroke="#fff" stroke-width="2"/>
    <text x="32" y="64" fill="#fff" font-size="25" font-weight="700">UI</text>
    <text x="110" y="35" font-size="18" font-weight="600" fill="#245d87">Interface &amp; front-end</text>
    <text x="110" y="61" font-size="14" fill="#344f60">React · TypeScript · JavaScript · HTML · CSS</text>
    <text x="110" y="84" font-size="14" fill="#344f60">Figma · Framer Motion · responsive systems</text>
    <text x="110" y="105" font-size="12" fill="#718491">Primary workspace</text>
  </g>
  <g transform="translate(590 202)">
    <rect width="560" height="117" rx="6" fill="#fff" stroke="#c5d8e3"/>
    <rect x="17" y="17" width="74" height="74" rx="14" fill="url(#iconGreen)" stroke="#fff" stroke-width="2"/>
    <text x="30" y="64" fill="#fff" font-size="23" font-weight="700">API</text>
    <text x="110" y="35" font-size="18" font-weight="600" fill="#245d87">Backend &amp; data</text>
    <text x="110" y="61" font-size="14" fill="#344f60">Hono · Cloudflare Workers · D1 · Drizzle</text>
    <text x="110" y="84" font-size="14" fill="#344f60">FastAPI · PostgreSQL · Better Auth · Zod</text>
    <text x="110" y="105" font-size="12" fill="#718491">Used depending on the product</text>
  </g>
  <g transform="translate(50 335)">
    <rect width="520" height="117" rx="6" fill="#fff" stroke="#c5d8e3"/>
    <rect x="17" y="17" width="74" height="74" rx="14" fill="url(#iconOrange)" stroke="#fff" stroke-width="2"/>
    <text x="31" y="64" fill="#fff" font-size="21" font-weight="700">DEV</text>
    <text x="110" y="35" font-size="18" font-weight="600" fill="#245d87">Tooling &amp; delivery</text>
    <text x="110" y="61" font-size="14" fill="#344f60">Vite · Git · GitHub · Vercel · Cloudflare</text>
    <text x="110" y="84" font-size="14" fill="#344f60">CI checks · deployment · project workflows</text>
    <text x="110" y="105" font-size="12" fill="#718491">From local build to production</text>
  </g>
  <g transform="translate(590 335)">
    <rect width="560" height="117" rx="6" fill="#fff" stroke="#c5d8e3"/>
    <rect x="17" y="17" width="74" height="74" rx="14" fill="url(#iconPurple)" stroke="#fff" stroke-width="2"/>
    <text x="29" y="64" fill="#fff" font-size="21" font-weight="700">UX</text>
    <text x="110" y="35" font-size="18" font-weight="600" fill="#245d87">Product &amp; design</text>
    <text x="110" y="61" font-size="14" fill="#344f60">Flows · prototypes · hierarchy · interaction states</text>
    <text x="110" y="84" font-size="14" fill="#344f60">Product decisions · UI systems · iteration</text>
    <text x="110" y="105" font-size="12" fill="#718491">Design and implementation in the same loop</text>
  </g>
</g>
<rect x="21" y="470" width="1158" height="31" fill="#edf5f9" stroke="#c5d6df"/>
<text x="42" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#607786">4 categories · React, TypeScript, Figma, Cloudflare, FastAPI and more</text>
</svg>